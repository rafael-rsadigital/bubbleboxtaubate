                        primary: 'var(--primary)',

                        background: 'var(--background)',
                        'background-soft': 'var(--background-soft)',

    <!-- Schema.org JSON-LD para FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Como funciona uma lavanderia self-service?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Você utiliza máquinas industriais de forma simples e prática. Basta escolher a máquina, iniciar o ciclo e aguardar a conclusão da lavagem e da secagem."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso levar sabão?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. Os produtos utilizados durante a lavagem já são adicionados automaticamente durante o ciclo."
          }
        },
        {
          "@type": "Question",
          "name": "Posso lavar edredons?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim. As máquinas possuem capacidade para peças volumosas, como edredons, cobertores e mantas."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto tempo demora?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O tempo pode variar conforme o ciclo escolhido, mas normalmente todo o processo de lavagem e secagem é concluído em aproximadamente uma hora."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso agendar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Não. Basta comparecer à unidade durante o horário de funcionamento."
          }
        }
      ]
    }
    </script>
